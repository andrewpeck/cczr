---
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  TARGET: x86_64-unknown-linux-gnu

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      # Cargo.toml is the source of truth for the version; the tag has to agree
      # with it, or we would ship a tarball named for one version containing a
      # binary that reports another. Runs before the build so drift fails fast.
      - name: Check tag matches Cargo.toml
        run: |
          set -euo pipefail
          manifest=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[0].version')
          if [ "v$manifest" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $manifest"
            echo "bump version in Cargo.toml (and Cargo.lock) or retag"
            exit 1
          fi
          echo "version $manifest matches tag $GITHUB_REF_NAME"

      - name: Test
        run: cargo test --release --locked

      - name: Build
        run: cargo build --release --locked

      - name: Package
        run: |
          set -euo pipefail
          name="cczr-${GITHUB_REF_NAME}-${TARGET}"
          strip target/release/cczr
          mkdir -p "dist/${name}"
          cp target/release/cczr README.org "dist/${name}/"
          tar czf "${name}.tar.gz" -C "dist/${name}" .
          sha256sum "${name}.tar.gz" > "${name}.tar.gz.sha256"
          echo "ASSET=${name}.tar.gz" >> "$GITHUB_ENV"

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            "$ASSET" "$ASSET.sha256"
